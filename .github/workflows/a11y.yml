name: Accessibility (axe)

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  a11y:
    name: axe WCAG A/AA (apps/app)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # GitHub Actions sets $HOME to /github/home (owned by "pwuser") inside container jobs,
    # but this image runs as root - Firefox refuses to launch as root when $HOME isn't owned by
    # that user. Playwright's own error message for this names the fix: HOME=/root.
    env:
      HOME: /root

    # runs inside Microsoft's official Playwright image instead of installing browsers/OS
    # deps as a CI step - that install (apt mirrors + Playwright's own CDN) was the source of
    # "increasingly inconsistent" CI failures (issue #245). The image ships firefox/chromium and
    # their system deps pre-baked, so there's nothing left to flake on. Tag MUST match
    # frontend/e2e's installed @playwright/test version exactly (checked by
    # .github/actions/e2e-setup, via the playwright-version input below) - Playwright can't find
    # browser executables on a mismatch. Bump the image tag and that input together, in both this file
    # and its sibling (e2e.yml / a11y.yml).
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      # --ipc=host - Chromium can OOM/crash without it (Playwright's own Docker
      # guidance). --init - reaps zombie processes left by the webServer's uvicorn/vite children.
      options: --ipc=host --init

    # Separate from e2e.yml so it's its own required status check. Meant to block merges (branch
    # protection on "axe WCAG A/AA (apps/app)"), unlike e2e.yml, which isn't a deploy gate yet.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyxie_tarot_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/e2e-setup
        with:
          playwright-version: "1.63.0"

      - name: Run E2E tests
        working-directory: frontend/e2e
        run: pnpm test:a11y

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: a11y-playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 7
