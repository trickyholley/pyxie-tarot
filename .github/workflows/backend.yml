name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  test:
    name: Lint, format and test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyxie_tarot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Write .env
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/pyxie_tarot_test
          SECRET_KEY=ci-test-secret-key-not-for-production
          EOF

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Lint (ruff check)
        working-directory: backend
        run: uv run ruff check .

      - name: Format check (ruff format)
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run tests
        working-directory: backend
        run: uv run pytest

  deploy:
    name: Deploy to EC2
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOST }}" > ~/.ssh/known_hosts

      - name: Build and restart backend
        run: |
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts deploy@${{ secrets.DEPLOY_HOST }} '
            cd /home/deploy/pyxie-tarot &&
            git pull &&
            cd infra &&
            ./fetch-secrets.sh &&
            docker compose build backend &&
            docker compose up -d backend
          '

      - name: Smoke test
        run: |
          sleep 5
          curl -sf https://api.pyxietarot.live/ > /dev/null
