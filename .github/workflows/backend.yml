name: Backend CI

# The path filter is on `push` only, deliberately - `pull_request` stays
# unfiltered.
#
# On push it does the job this was added for: a frontend-only commit no
# longer rebuilds and redeploys the backend, which is what turned 8d2646e
# into the 2026-09-01 outage. infra/** and scripts/** are listed because the
# deploy git-pulls on the box and steps below run scripts/ from the repo
# root, so changes there genuinely need this workflow.
#
# On pull_request it must NOT be filtered: the "Main" ruleset requires this
# workflow's test job ("Lint, format and test") to pass before a PR can
# merge. A workflow skipped by path filtering never creates its check run at
# all - the check sits Pending rather than reporting success, and the PR is
# blocked forever. Filtering here would deadlock every frontend-only PR.
# Running backend tests on an unrelated PR costs a minute; not being able to
# merge costs the afternoon.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "infra/**"
      - "scripts/**"
      - ".github/workflows/backend.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Manual trigger for the case the path filters above deliberately exclude:
  # bringing up a box that has no code on it yet. `terraform apply` replaces
  # the instance whenever user_data changes, and the replacement starts empty
  # - the deploy step clones and brings the whole compose stack up, but only
  # if something runs it. Without this the only way to redeploy an unchanged
  # main is an empty commit.
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    name: Lint, format and test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyxie_tarot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Check for leftover 'CLAUDE ' draft strings
        run: python3 scripts/check_claude_prefix.py $(git ls-files 'backend/*.py')

      - name: Check migration safety
        # Only migrations this PR adds - ones already merged already shipped
        # safely. See backend/migrations/check_migration_safety.py for why.
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin ${{ github.event.pull_request.base.sha }}
          NEW_MIGRATIONS=$(git diff --name-only --diff-filter=A ${{ github.event.pull_request.base.sha }} -- backend/migrations/versions/)
          if [ -n "$NEW_MIGRATIONS" ]; then
            python3 backend/migrations/check_migration_safety.py $NEW_MIGRATIONS
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned rather than left to resolve "latest" - no uv.toml/pyproject.toml at the repo root
          # (backend/ is a subdirectory) means every unpinned run falls back to fetching the version
          # manifest from raw.githubusercontent.com, an extra network dependency that can (and did)
          # fail transiently. Bump deliberately alongside the locally-installed uv version.
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        working-directory: backend
        run: uv sync

      - name: Write .env
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@localhost:5432/pyxie_tarot_test
          SECRET_KEY=ci-test-secret-key-not-for-production
          EOF

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Lint (ruff check)
        working-directory: backend
        run: uv run ruff check .

      - name: Format check (ruff format)
        working-directory: backend
        run: uv run ruff format --check .

      - name: Run tests
        working-directory: backend
        run: uv run pytest

  deploy:
    name: Deploy to EC2
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Build and restart backend via SSM
        # No SSH key, no host key - IAM (via OIDC, see github-oidc.tf) is the
        # only credential, and Run Command executes these directly on the
        # instance through the SSM Agent baked into the AMI. Waits for
        # cloud-init first (relevant right after a fresh instance replaces
        # the old one) and is self-healing against a fresh box the same way
        # the old SSH version was: clones if the repo isn't there yet, and
        # brings up every compose service (not just backend) so caddy - which
        # a fresh box has never started - comes up too. All are no-ops
        # against a box that's already up to date. Migrations run against
        # the freshly-built image via `run --rm` before `up -d` swaps the
        # running container over, so the schema is ready before new code
        # starts serving. AWS-RunShellScript concatenates this whole array
        # into one script and runs it without `set -e` - a failing command
        # wouldn't stop the rest, and the overall status only reflects the
        # last command's exit code. `set -e` up front makes a failed
        # migration actually fail the deploy instead of silently proceeding
        # to `up -d` anyway. The migration runs before the swap, so the old
        # code is still serving requests once it lands - fine for additive
        # changes, not for anything the old code relies on.
        # check_migration_safety.py catches most of that at PR time; this
        # comment is the reminder for anything it doesn't.
        run: |
          cat > /tmp/ssm-params.json <<EOF
          {
            "commands": [
              "set -e",
              "cloud-init status --wait > /dev/null",
              "if [ ! -d /home/deploy/pyxie-tarot/.git ]; then git clone https://github.com/${{ github.repository }}.git /home/deploy/pyxie-tarot; fi",
              "cd /home/deploy/pyxie-tarot && git pull",
              "cd /home/deploy/pyxie-tarot/infra && ./fetch-secrets.sh",
              "cd /home/deploy/pyxie-tarot/infra && docker compose build backend",
              "cd /home/deploy/pyxie-tarot/infra && docker compose run --rm backend alembic upgrade head",
              "cd /home/deploy/pyxie-tarot/infra && docker compose up -d",
              "docker system prune -f --filter until=168h || true"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=pyxie-tarot-backend" \
            --parameters file:///tmp/ssm-params.json \
            --query "Command.CommandId" --output text)

          # list-command-invocations can briefly return nothing right after
          # send-command before SSM has dispatched it - give it a moment.
          # Guarded for the same reason as the status poll below: an
          # unguarded assignment from command substitution trips `bash -e`,
          # so one blipped call here would kill the step instead of retrying.
          # An empty value just fails the -n test and loops again.
          INSTANCE_ID=""
          for i in $(seq 1 10); do
            INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query "CommandInvocations[0].InstanceId" --output text 2>/dev/null) || INSTANCE_ID=""
            [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ] && break
            sleep 2
          done
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::SSM never dispatched command $COMMAND_ID to the tagged instance"
            exit 1
          fi

          # `aws ssm wait command-executed` gives up after 20 attempts x 5s
          # = 100 seconds, but a cold-cache `docker compose build` on the box
          # runs far longer - the 2026-09-01 deploy took 20 minutes. The waiter
          # bailed at 100s and printed Status=InProgress with empty stdout and
          # stderr, so the real failure (InvalidPasswordError, 18 minutes later)
          # never reached these logs and the outage had to be diagnosed from the
          # SSM console instead. Poll to a terminal status with a real budget.
          #
          # `|| CMD_STATUS="Unreadable"` is load-bearing. GitHub Actions runs
          # `run:` steps under `bash -e`, and -e fires on a failing assignment
          # from command substitution - so one throttled or blipped API call
          # anywhere in this 30-minute poll would kill the step outright and
          # skip the diagnostic dump below, which is the whole point of the
          # step. A status we couldn't read is not a terminal status, so it
          # falls through the case and retries on the next tick; if the API
          # stays unreachable the loop times out and the check after it fails
          # the deploy properly.
          STATUS=0
          CMD_STATUS=""
          for i in $(seq 1 180); do
            CMD_STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null) || CMD_STATUS="Unreadable"
            case "$CMD_STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) STATUS=1; break ;;
            esac
            sleep 10
          done
          if [ "$CMD_STATUS" != "Success" ] && [ "$STATUS" -eq 0 ]; then
            echo "::error::SSM command $COMMAND_ID still $CMD_STATUS after 30 minutes"
            STATUS=1
          fi

          # Also guarded: a blip here would otherwise exit with this call's code
          # under -e, replacing the real deploy outcome (and failing an
          # otherwise-successful deploy) before `exit $STATUS` is ever reached.
          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" --output json || true

          exit $STATUS

      - name: Checkout
        uses: actions/checkout@v7

      - name: Smoke test
        run: |
          sleep 20
          ./infra/smoke-test.sh
