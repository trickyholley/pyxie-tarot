name: E2E tests

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (Firefox + Chromium)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # CLAUDE: GitHub Actions sets $HOME to /github/home (owned by "pwuser") inside container jobs,
    # but this image runs as root - Firefox refuses to launch as root when $HOME isn't owned by
    # that user. Playwright's own error message for this names the fix: HOME=/root.
    env:
      HOME: /root

    # CLAUDE: runs inside Microsoft's official Playwright image instead of installing browsers/OS
    # deps as a CI step - that install (apt mirrors + Playwright's own CDN) was the source of
    # "increasingly inconsistent" CI failures (issue #245). The image ships firefox/chromium and
    # their system deps pre-baked, so there's nothing left to flake on. Tag MUST match
    # frontend/e2e's installed @playwright/test version exactly (see the "Verify Playwright
    # version" step below) - Playwright can't find browser executables on a mismatch. Bump both
    # together.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      # CLAUDE: --ipc=host - Chromium can OOM/crash without it (Playwright's own Docker
      # guidance). --init - reaps zombie processes left by the webServer's uvicorn/vite children.
      options: --ipc=host --init

    # Not wired as a `needs:` dependency of backend.yml/frontend.yml's deploy jobs - this suite is
    # new and shouldn't get to block shipping while it's still stabilizing. Revisit once proven
    # reliable.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyxie_tarot_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned rather than left to resolve "latest" - see backend.yml for why.
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Write backend .env
        # CLAUDE: job steps run inside the `container:` above, so service containers are reached
        # by their label as hostname (postgres/redis), not localhost - localhost here means this
        # container. ALLOW_SEED is needed because of that same hostname: dev_seed.py's guard only
        # auto-allows localhost/127.0.0.1, and "postgres" doesn't match even though it's this same
        # ephemeral CI database - see app/dev_seed.py.
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pyxie_tarot_e2e
          SECRET_KEY=ci-e2e-secret-key-not-for-production
          REDIS_URL=redis://redis:6379/0
          ALLOW_SEED=true
          EOF

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Seed dev fixture data
        # Gives the suite the dev admin (admin/pyxie-tarot), the system RWS deck, and example
        # spreads - see backend/app/dev_seed.py.
        # CLAUDE: safe here since this is a throwaway CI database, allowed via ALLOW_SEED above
        # (see the "Write backend .env" step for why it's needed).
        working-directory: backend
        run: uv run python -m app.dev_seed

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify Playwright version matches container image
        working-directory: frontend
        run: |
          installed=$(node -e "console.log(require('./e2e/node_modules/@playwright/test/package.json').version)")
          image_version="1.62.1"
          if [ "$installed" != "$image_version" ]; then
            echo "::error::frontend/e2e's @playwright/test is $installed but .github/workflows/e2e.yml's container is pinned to mcr.microsoft.com/playwright:v${image_version}-noble - bump the image tag to match."
            exit 1
          fi

      - name: Run E2E tests
        working-directory: frontend/e2e
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 7
