name: E2E tests

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, synchronize, reopened, ready_for_review ]

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright (Firefox + Chromium)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      HOME: /root

    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host --init

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pyxie_tarot_e2e
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          # Pinned rather than left to resolve "latest" - see backend.yml for why.
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync

      - name: Write backend .env
        # ALLOW_SEED is needed because of that same hostname: dev_seed.py's guard only
        # auto-allows localhost/127.0.0.1 - see app/dev_seed.py.
        working-directory: backend
        run: |
          cat > .env <<'EOF'
          DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/pyxie_tarot_e2e
          SECRET_KEY=ci-e2e-secret-key-not-for-production
          REDIS_URL=redis://redis:6379/0
          ALLOW_SEED=true
          EOF

      - name: Run migrations
        working-directory: backend
        run: uv run alembic upgrade head

      - name: Seed dev fixture data
        working-directory: backend
        run: uv run python -m app.dev_seed

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Verify Playwright version matches container image
        working-directory: frontend
        run: |
          installed=$(node -e "console.log(require('./e2e/node_modules/@playwright/test/package.json').version)")
          image_version="1.62.1"
          if [ "$installed" != "$image_version" ]; then
            echo "::error::frontend/e2e's @playwright/test is $installed but .github/workflows/e2e.yml's container is pinned to mcr.microsoft.com/playwright:v${image_version}-noble - bump the image tag to match."
            exit 1
          fi

      - name: Run E2E tests
        working-directory: frontend/e2e
        run: pnpm test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/e2e/playwright-report/
          retention-days: 7
