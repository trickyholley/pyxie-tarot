name: Migration credential canary

# The RDS master password has exactly one consumer - `alembic upgrade head` at
# deploy time (migrations/env.py connects with the master password rather than
# IAM; the app's runtime engine uses IAM as pyxie_app and never touches it).
# That means a broken master-password path is invisible until the next deploy,
# which can be weeks later and is usually an unrelated change. It has now caused
# two outages: 2026-08-14 (a migration granted rds_iam to the master user,
# disabling its password auth) and 2026-09-01 (managed rotation produced a
# password containing '$', which Compose's env_file interpolation ate before
# the container saw it). Both sat undetected until a deploy tripped over them.
#
# smoke-test.yml can't cover this - it runs from a GitHub runner and RDS is not
# publicly accessible, so the check has to execute on the instance. Six-hourly
# rather than smoke-test.yml's 30 minutes: rotation is monthly, and this spins a
# container on a 904 MB box.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check:
    name: Verify migrations can authenticate
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      - name: Run alembic current on the instance
        # `alembic current` only reads alembic_version, so this exercises the
        # full fetch-secrets -> DATABASE_URL -> asyncpg -> RDS path (the exact
        # path that failed both times) without touching the schema. Re-running
        # fetch-secrets.sh first is deliberate: it's what would pick up a
        # freshly rotated password, and regenerating .env is idempotent.
        run: |
          cat > /tmp/canary-params.json <<'EOF'
          {
            "commands": [
              "set -e",
              "cd /home/deploy/pyxie-tarot/infra && ./fetch-secrets.sh",
              "cd /home/deploy/pyxie-tarot/infra && docker compose run --rm backend alembic current"
            ]
          }
          EOF

          COMMAND_ID=$(aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=pyxie-tarot-backend" \
            --parameters file:///tmp/canary-params.json \
            --query "Command.CommandId" --output text)

          # Guarded against `bash -e` - see backend.yml's note.
          INSTANCE_ID=""
          for i in $(seq 1 10); do
            INSTANCE_ID=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --query "CommandInvocations[0].InstanceId" --output text 2>/dev/null) || INSTANCE_ID=""
            [ -n "$INSTANCE_ID" ] && [ "$INSTANCE_ID" != "None" ] && break
            sleep 2
          done
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::SSM never dispatched command $COMMAND_ID to the tagged instance"
            exit 1
          fi

          # `|| CMD_STATUS="Unreadable"` guards against `bash -e` killing the
          # step on a single throttled API call mid-poll - see backend.yml's
          # longer note. A status we couldn't read isn't terminal, so it
          # retries; a persistently unreachable API times the loop out and
          # fails below.
          STATUS=0
          CMD_STATUS=""
          for i in $(seq 1 60); do
            CMD_STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --query "Status" --output text 2>/dev/null) || CMD_STATUS="Unreadable"
            case "$CMD_STATUS" in
              Success) break ;;
              Failed|Cancelled|TimedOut) STATUS=1; break ;;
            esac
            sleep 10
          done
          if [ "$CMD_STATUS" != "Success" ] && [ "$STATUS" -eq 0 ]; then
            echo "::error::canary still $CMD_STATUS after 10 minutes"
            STATUS=1
          fi

          aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
            --query "{Status:Status,StdOut:StandardOutputContent,StdErr:StandardErrorContent}" --output json || true

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::Migrations cannot authenticate to RDS - the next deploy will fail at 'alembic upgrade head'. See the 2026-09-01 postmortem."
          fi
          exit $STATUS
