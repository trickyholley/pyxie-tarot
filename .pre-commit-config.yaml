fail_fast: true

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        require_serial: true
      - id: end-of-file-fixer
        require_serial: true
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.73.0
    hooks:
      - id: oxlint
        args: [ --quiet ]
        files: ^frontend/(apps|packages)/
        types_or: [ ts, javascript, tsx, jsx ]
        require_serial: true

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: frontend/node_modules/.bin/oxfmt --write --no-error-on-unmatched-pattern
        language: system
        files: ^frontend/(apps|packages)/
        types_or: [ ts, javascript, tsx, jsx, json ]
        require_serial: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [ --fix ]
        files: ^backend/
        types: [ python ]
        require_serial: true
      - id: ruff-format
        files: ^backend/
        types: [ python ]
        require_serial: true

  - repo: local
    hooks:
      - id: license-header
        name: license header (new files, auto-added if missing)
        entry: python3 scripts/check_license_headers.py
        language: system
        files: ^(backend/|frontend/(apps|packages)/).*\.(py|ts|tsx|js|jsx)$
        exclude: ^backend/migrations/
        require_serial: true

      - id: playwright-version-sync
        name: playwright version matches CI container image
        entry: python3 scripts/check_playwright_version.py
        language: system
        files: ^(frontend/pnpm-lock\.yaml|\.github/workflows/e2e\.yml)$
        pass_filenames: false
        require_serial: true

      - id: claude-prefix-leak
        name: no leftover 'CLAUDE ' draft strings in code
        entry: python3 scripts/check_claude_prefix.py
        language: system
        files: ^(backend/|frontend/(apps|packages)/).*\.(py|ts|tsx|js|jsx|json)$
        require_serial: true
