fail_fast: true

# The native shells (frontend/apps/app/ios/, .../android/) keep their own conventions (Xcode's
# space-before-colon JSON, committed build-tool output) and any incidental touch trips CI's
# native version-bump guards (check-ios-version-bump.mjs / check-native-version-bump.mjs) - so no
# hook below should reformat or rewrite anything under them.
exclude: ^frontend/apps/app/(ios|android)/

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        require_serial: true
      - id: end-of-file-fixer
        require_serial: true
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  # Runs each project's own oxlint/oxfmt/ruff (lockfile-pinned, bumped by Dependabot) rather than
  # mirror repos with their own `rev`, so pre-commit can't drift from what CI runs.
  - repo: local
    hooks:
      - id: oxlint
        name: oxlint
        entry: frontend/node_modules/.bin/oxlint --quiet --no-error-on-unmatched-pattern
        language: system
        files: ^frontend/(apps|packages)/
        types_or: [ ts, javascript, tsx, jsx ]
        require_serial: true

      - id: oxfmt
        name: oxfmt
        # Auto-stages what it reformats so a clean format doesn't force a second `git commit` -
        # pre-commit otherwise reports "files were modified by this hook" and aborts regardless of
        # the tool's own exit code. `&&` still lets a real failure (unparseable file) block staging.
        entry: bash -c 'frontend/node_modules/.bin/oxfmt --write --no-error-on-unmatched-pattern "$@" && git add "$@"' --
        language: system
        files: ^frontend/(apps|packages)/
        types_or: [ ts, javascript, tsx, jsx, json ]
        require_serial: true

      - id: ruff
        name: ruff
        # `--fix` then auto-stages, like oxfmt above - a real lint failure still short-circuits before `git add`.
        entry: bash -c 'backend/.venv/bin/ruff check --force-exclude --fix "$@" && git add "$@"' --
        language: system
        files: ^backend/
        types: [ python ]
        require_serial: true

      - id: ruff-format
        name: ruff-format
        entry: bash -c 'backend/.venv/bin/ruff format --force-exclude "$@" && git add "$@"' --
        language: system
        files: ^backend/
        types: [ python ]
        require_serial: true

      - id: license-header
        name: license header (new files, auto-added if missing)
        entry: python3 scripts/check_license_headers.py
        language: system
        files: ^(backend/|frontend/(apps|packages)/).*\.(py|ts|tsx|js|jsx)$
        exclude: ^backend/migrations/
        require_serial: true

      - id: playwright-version-sync
        name: playwright version matches CI container image
        entry: python3 scripts/check_playwright_version.py
        language: system
        files: ^(frontend/pnpm-lock\.yaml|\.github/workflows/e2e\.yml)$
        pass_filenames: false
        require_serial: true
