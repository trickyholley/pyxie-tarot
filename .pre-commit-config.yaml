repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        require_serial: true
      - id: end-of-file-fixer
        require_serial: true
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files

  - repo: https://github.com/oxc-project/mirrors-oxlint
    rev: v1.73.0
    hooks:
      - id: oxlint
        args: [ --quiet ]
        files: ^frontend/(apps|packages)/
        types_or: [ ts, javascript, tsx, jsx ]
        require_serial: true

  - repo: local
    hooks:
      - id: oxfmt
        name: oxfmt
        entry: pnpm --dir frontend exec oxfmt --write --no-error-on-unmatched-pattern
        language: system
        files: ^frontend/(apps|packages)/
        types_or: [ ts, javascript, tsx, jsx ]
        require_serial: true

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.0
    hooks:
      - id: ruff
        args: [ --fix ]
        files: ^backend/
        types: [ python ]
        require_serial: true
      - id: ruff-format
        files: ^backend/
        types: [ python ]
        require_serial: true

  - repo: local
    hooks:
      - id: license-header
        name: license header (new files)
        entry: python3 scripts/check_license_headers.py
        language: system
        files: ^(backend/|frontend/(apps|packages)/).*\.(py|ts|tsx|js|jsx)$
        exclude: ^backend/migrations/
        require_serial: true

  - repo: local
    hooks:
      - id: pytest
        name: pytest (backend)
        entry: bash -c 'cd backend && uv run pytest -q'
        language: system
        files: ^backend/
        types: [ python ]
        pass_filenames: false
        require_serial: true
        verbose: true

      - id: vitest
        name: vitest (frontend)
        entry: >-
          bash -c '
          cd frontend &&
          log=$(mktemp) &&
          CI=true pnpm test -- --reporter=basic > "$log" 2>&1;
          status=$?;
          if [ $status -eq 0 ]; then sed -E "s/\x1b\[[0-9;]*m//g" "$log" | grep -E "^ *(Test Files|Tests|Start at|Duration)"; else cat "$log"; fi;
          rm -f "$log";
          exit $status
          '
        language: system
        files: ^frontend/(apps|packages)/
        types_or: [ ts, javascript, tsx, jsx ]
        pass_filenames: false
        require_serial: true
        verbose: true
