[project]
name = "pyxie-tarot"
version = "0.1.0"
description = "A tarot reading application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.31.0",
    "boto3>=1.40.0",
    "fastapi>=0.141.1",
    "fonttools[woff]>=4.63.0",
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.15.0",
    "pydantic[email]>=2.13.4",
    "python-jose>=3.5.0",
    "redis>=8.1.0",
    "reportlab>=5.0.1",
    "resend>=2.35.0",
    "ruff>=0.16.2",
    "sqlalchemy[asyncio]>=2.0.51",
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.52.1",
]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["migrations", "__pycache__", ".venv"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "SIM", "UP", "N", "ASYNC", "PERF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**/*.py" = ["S101", "ANN"]
"conftest.py" = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["pyxie_tarot"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2.0", "ruff>=0.16.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
# Session-scoped rather than the default per-test loop: app.redis_client's module-level singleton
# (mirrors the real app, which also has exactly one event loop for its whole life) binds its connection
# pool to whichever loop first uses it - a fresh loop per test would break every test after the first
# with "Event loop is closed" once that first loop tears down. Function-scoped fixtures (db_engine, etc.)
# are unaffected - this only changes which loop their async code executes on, not how often they run.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
