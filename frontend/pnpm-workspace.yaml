packages:
  - "packages/*"
  - "apps/*"
  - "e2e"

allowBuilds:
  sharp: true

overrides:
  brace-expansion: ^5.0.9
  fast-uri: ^3.1.5
  postcss: ^8.5.18
  "@hono/node-server": ^2.0.5
  hono: ^4.12.34
  undici: ^7.29.0
  js-yaml: ^4.3.1
  ip-address: ^10.3.1
  # @capacitor/assets@3.0.5 (latest, dev-only icon/splash tooling - see issue 175) bundles its own
  # outdated @capacitor/cli@5.7.8, dragging in these vulnerable transitives. Scoped to their original
  # major so unrelated resolutions (e.g. minimatch@10 via glob@11) are untouched.
  "tar@6": ^7.5.21
  sharp: ^0.35.0
  "minimatch@3": ^3.1.4
  uuid: ^11.1.1
